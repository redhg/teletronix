name: CI

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test

    browsers:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium firefox webkit
            # The runner has no sound device, and without one Firefox's Web Audio never
            # starts (Chromium and WebKit fall back to a silent output). PulseAudio gives it
            # one: with no hardware, it makes a silent "null" output.
            - name: Virtual sound device
              run: |
                  sudo apt-get install -y --no-install-recommends pulseaudio
                  pulseaudio --daemonize --exit-idle-time=-1
                  pactl info
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
