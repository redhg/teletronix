name: CI

on:
    push:
    pull_request:

# Only the desktop job starts Electron; the others skip downloading it (ELECTRON_SKIP_BINARY_DOWNLOAD).
#
# Pinned to Ubuntu 24.04, rather than ubuntu-latest: the browser job installs Playwright's
# system packages and PulseAudio, which a new Ubuntu can break. Move up deliberately.
jobs:
    check:
        runs-on: ubuntu-24.04
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test

    browsers:
        runs-on: ubuntu-24.04
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium firefox webkit
            # The runner has no sound device, and without one Firefox's Web Audio never
            # starts (Chromium and WebKit fall back to a silent output). PulseAudio gives it
            # one: with no hardware, it makes a silent "null" output.
            - name: Virtual sound device
              run: |
                  sudo apt-get install -y --no-install-recommends pulseaudio
                  pulseaudio --daemonize --exit-idle-time=-1
                  pactl info
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

    # The desktop app (desktop/), started for real: its window, menus and GM panel.
    desktop:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # Ubuntu 24.04 keeps apps from the user namespaces Electron's sandbox uses
            - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            - run: xvfb-run --auto-servernum npm run test:desktop

    # Publishes the build to GitHub Pages (https://teletronix.net/), once
    # everything above has passed, on a push to main.
    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [check, browsers]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pages: write
            id-token: write
        # one deploy at a time; a newer push waits for the one before
        concurrency:
            group: pages
            cancel-in-progress: false
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v5
