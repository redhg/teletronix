name: CI

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test

    browsers:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium firefox webkit
            # The runner has no sound device, and without one Firefox's Web Audio never
            # starts (Chromium and WebKit fall back to a silent output). PulseAudio gives it
            # one: with no hardware, it makes a silent "null" output.
            - name: Virtual sound device
              run: |
                  sudo apt-get install -y --no-install-recommends pulseaudio
                  pulseaudio --daemonize --exit-idle-time=-1
                  pactl info
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

    # Publishes the build to GitHub Pages (https://redhg.github.io/teletronix/), once
    # everything above has passed, on a push to main.
    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [check, browsers]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        # one deploy at a time; a newer push waits for the one before
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v5
